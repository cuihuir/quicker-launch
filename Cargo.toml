[package]
name = "quick-launcher"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "A native application launcher and clipboard history for Fedora GNOME"
license = "MIT"

[dependencies]
anyhow = "1"
gtk = { package = "gtk4", version = "0.10", features = ["v4_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[profile.dev]
debug = 0

[profile.release]
strip = true
debug = 0

